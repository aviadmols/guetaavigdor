      - heading "חברת גואטה אביגדור בע\"מ מספקת שירות למחפשים מחסן עצים במודיעין" [level=2] [ref=f39e98]
      - paragraph [ref=f39e99]: "לחברת גואטה אביגדור בע”מ מחסן עצים שמיקומו בראשון לציון הוא אך מספק שירות ומוצרים לעסקים ואנשים פרטיים מאזור המרכז. עסקים ואנשים פרטיים רבים מגיעים למחסן העצים של גואטה אביגדור מישובים רבים באזור המרכז כדוגמת: תל אביב, מודיעין, רחובות וישובים נוספים."
      - paragraph [ref=f39e100]: חברת גואטה אביגדור הוקמה ב-1980 והיא מספקת עצים למגזר העסקי והפרטי וידועה בשירות המסור, היעיל והמקצועי שהיא מספקת לעסקים רבים באזור המרכז. מחסן העצים של גואטה אביגדור מכיל מגוון עשיר של סוגי עצים שונים ברמות גימור שונות המיועדים למטרות שונות. בין אם אתה מעוניין בעצים לדקים, פרגולות, סוככים, חיפויי עץ או גדרות, בגואטה אביגדור אתה תמצא את העץ המתאים באיכות גבוה ובמחיר משתלם.
      - heading "צוות המומחים שלנו ישמח לסייע לך" [level=2] [ref=f39e101]
      - paragraph [ref=f39e102]: "במחסן העצים שלנו תוכל להסתייע בצוות המומחים שלנו שישמח לייעץ לך על סוג העץ שמתאים לצרכים שלך, על חומרים וכלי עבודה שונים. צוות המומחים בחברה שלנו מורכב ממקצוענים בתחום שישמחו לתת לך שירות אדיב ומקצועי. בנוסף לעצים תוכל למצוא אצלנו ציוד רב ומגוון כגון:"
